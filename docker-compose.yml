x-node: &node
  image: distkv-node:latest
  build: .
  environment: &env
    PEERS: "node1=http://node1:8000,node2=http://node2:8000,node3=http://node3:8000,node4=http://node4:8000,node5=http://node5:8000"
    N: "3"
    W: "2"
    R: "2"
    DATA_DIR: /data
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 3s
    timeout: 2s
    retries: 10

services:
  node1:
    <<: *node
    environment:
      <<: *env
      NODE_ID: node1
    ports: ["8001:8000"]
    volumes: ["node1-data:/data"]
  node2:
    <<: *node
    environment:
      <<: *env
      NODE_ID: node2
    ports: ["8002:8000"]
    volumes: ["node2-data:/data"]
  node3:
    <<: *node
    environment:
      <<: *env
      NODE_ID: node3
    ports: ["8003:8000"]
    volumes: ["node3-data:/data"]
  node4:
    <<: *node
    environment:
      <<: *env
      NODE_ID: node4
    ports: ["8004:8000"]
    volumes: ["node4-data:/data"]
  node5:
    <<: *node
    environment:
      <<: *env
      NODE_ID: node5
    ports: ["8005:8000"]
    volumes: ["node5-data:/data"]

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
